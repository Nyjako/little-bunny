name: Release

# Every push to master: run the full test suite, and if it passes, build the
# server + app for every platform/architecture this codebase can support
# without real extra engineering work, and publish them as separate assets on
# one GitHub Release tagged by run number.
on:
  push:
    branches: [master]

env:
  FLUTTER_VERSION: "3.44.0" # keep in sync with app/.fvmrc

permissions:
  contents: write # needed to create the Release

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-server-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential cmake libssl-dev
      - run: make release
      - run: tar -C build-release/server -czf bunny-server-linux-x64.tar.gz bunny_server
      - uses: actions/upload-artifact@v4
        with:
          name: bunny-server-linux-x64
          path: bunny-server-linux-x64.tar.gz

  build-app-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ninja-build libgtk-3-dev pkg-config libsecret-1-dev
      - working-directory: app
        run: |
          flutter pub get
          flutter build linux --release
      - working-directory: app/build/linux/x64/release
        run: zip -r "${{ github.workspace }}/little-bunny-app-linux-x64.zip" bundle
      - uses: actions/upload-artifact@v4
        with:
          name: little-bunny-app-linux-x64
          path: little-bunny-app-linux-x64.zip

  # GitHub's hosted Linux arm64 runner (GA for private repos as of early
  # 2026) -- native build on native hardware, identical steps to the x64 job
  # above, just a different runs-on and output architecture path.
  build-app-linux-arm64:
    needs: test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ninja-build libgtk-3-dev pkg-config libsecret-1-dev
      - working-directory: app
        run: |
          flutter pub get
          flutter build linux --release
      - working-directory: app/build/linux/arm64/release
        run: zip -r "${{ github.workspace }}/little-bunny-app-linux-arm64.zip" bundle
      - uses: actions/upload-artifact@v4
        with:
          name: little-bunny-app-linux-arm64
          path: little-bunny-app-linux-arm64.zip

  build-app-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - working-directory: app
        run: |
          flutter pub get
          # --split-per-abi produces one smaller APK per ABI instead of one
          # fat APK bundling all of them -- x86_64 covers emulators/x86
          # tablets, dropped 32-bit x86 (Play Store itself dropped it years
          # ago). BUILD_EXAMPLES=OFF (curl's CPM options in the top-level
          # CMakeLists.txt) is what keeps 3 full per-ABI NDK/CMake native
          # builds from exhausting the runner's disk the way 4 un-pruned ABIs
          # once did.
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64 --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: little-bunny-app-android-armeabi-v7a
          path: app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: little-bunny-app-android-arm64-v8a
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: little-bunny-app-android-x86_64
          path: app/build/app/outputs/flutter-apk/app-x86_64-release.apk

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: vcpkg install openssl:x64-windows
      - name: Build server
        run: |
          cmake -S . -B build-windows -DCMAKE_BUILD_TYPE=Release -DBUNNY_BUILD_TESTS=OFF -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
          cmake --build build-windows --config Release -j
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Build app
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release
      # Server and app are separate downloads -- someone grabbing one
      # shouldn't be forced to also download the other.
      - name: Package app
        working-directory: app/build/windows/x64/runner/Release
        run: Compress-Archive -Path * -DestinationPath "${{ github.workspace }}/little-bunny-app-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: bunny-server-windows-x64
          path: build-windows/server/Release/bunny_server.exe
      - uses: actions/upload-artifact@v4
        with:
          name: little-bunny-app-windows-x64
          path: little-bunny-app-windows-x64.zip

  # windows-11-arm: GitHub's hosted, *native* (non-emulated) ARM64 Windows
  # runner (GA for private repos as of Jan 2026). Flutter's windows build
  # tool can't officially cross-compile x64->arm64 yet, so this sidesteps
  # that entirely by building natively on an actual arm64 host instead --
  # same build command as the x64 job, no CMake changes. First time this
  # project has used this runner type; app-only (the C server stays
  # Windows x64-only, per scope).
  build-app-windows-arm64:
    needs: test
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - run: vcpkg install openssl:arm64-windows
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - working-directory: app
        run: |
          flutter pub get
          flutter build windows --release
      - working-directory: app/build/windows/arm64/runner/Release
        run: Compress-Archive -Path * -DestinationPath "${{ github.workspace }}/little-bunny-app-windows-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: little-bunny-app-windows-arm64
          path: little-bunny-app-windows-arm64.zip

  # Unsigned -- macOS Gatekeeper will warn on first launch until this is
  # signed with an Apple Developer certificate (not set up for this
  # project). Fine for personal/sideloaded use.
  build-app-macos-arm64:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - working-directory: app
        run: |
          flutter pub get
          flutter build macos --release
      - working-directory: app/build/macos/Build/Products/Release
        run: zip -r "${{ github.workspace }}/little-bunny-app-macos-arm64.zip" little_bunny.app
      - uses: actions/upload-artifact@v4
        with:
          name: little-bunny-app-macos-arm64
          path: little-bunny-app-macos-arm64.zip

  # macos-15-intel: GitHub's last surviving Intel macOS runner label
  # (macos-13 fully retired Dec 2025; this one's available until ~Aug 2027).
  # Native build on native hardware, identical steps to the arm64 job above.
  build-app-macos-x64:
    needs: test
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - working-directory: app
        run: |
          flutter pub get
          flutter build macos --release
      - working-directory: app/build/macos/Build/Products/Release
        run: zip -r "${{ github.workspace }}/little-bunny-app-macos-x64.zip" little_bunny.app
      - uses: actions/upload-artifact@v4
        with:
          name: little-bunny-app-macos-x64
          path: little-bunny-app-macos-x64.zip

  # Unsigned -- no Apple Developer account for this project, same tradeoff as
  # the macOS builds above. Installing this .ipa needs a sideloading tool
  # (AltStore, Sideloadly, or a personal re-sign) since it has no provisioning
  # profile. app/ios/ and bunny_core_ffi/ios/ were already fully scaffolded by
  # `flutter create` (podspec + C forwarder, same sources every other
  # platform uses) -- no app code changes needed for this target.
  build-app-ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - working-directory: app
        run: |
          flutter pub get
          flutter build ios --release --no-codesign
      - name: Package unsigned ipa
        working-directory: app/build/ios/iphoneos
        run: |
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r "${{ github.workspace }}/little-bunny-app-ios-arm64.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: little-bunny-app-ios-arm64
          path: little-bunny-app-ios-arm64.ipa

  release:
    needs:
      [
        build-server-linux,
        build-app-linux,
        build-app-linux-arm64,
        build-app-android,
        build-windows,
        build-app-windows-arm64,
        build-app-macos-arm64,
        build-app-macos-x64,
        build-app-ios,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }} (${{ github.sha }})"
          generate_release_notes: true
          files: artifacts/*

name: Release

# Every push to master: run the full test suite, and if it passes, build the
# server + app for every platform/architecture this codebase can support
# without real extra engineering work, and publish them as separate assets on
# one GitHub Release tagged by run number.
on:
  push:
    branches: [master]

env:
  FLUTTER_VERSION: "3.44.0" # keep in sync with app/.fvmrc

permissions:
  contents: write # needed to create the Release

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-server-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential cmake libssl-dev
      - run: make release
      - run: tar -C build-release/server -czf bunny-server-linux-x64.tar.gz bunny_server
      - uses: actions/upload-artifact@v4
        with:
          name: bunny-server-linux-x64
          path: bunny-server-linux-x64.tar.gz

  build-app-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ninja-build libgtk-3-dev pkg-config libsecret-1-dev
      - working-directory: app
        run: |
          flutter pub get
          flutter build linux --release
      - working-directory: app/build/linux/x64/release
        run: zip -r "${{ github.workspace }}/little-bunny-app-linux-x64.zip" bundle
      - uses: actions/upload-artifact@v4
        with:
          name: little-bunny-app-linux-x64
          path: little-bunny-app-linux-x64.zip

  build-app-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - working-directory: app
        run: |
          flutter pub get
          # --target-platform restricts the native (curl/sqlite3/cJSON/bunny_*)
          # NDK/CMake build to the two ABIs real phones actually use, instead
          # of also building (and bundling into the APK) x86/x86_64, which
          # only exist for Android emulators. Building a 3rd ABI (x86_64, via
          # --split-per-abi) reintroduced "No space left on device" even with
          # BUILD_EXAMPLES=OFF -- back to one fat 2-ABI APK.
          flutter build apk --release --target-platform android-arm,android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: little-bunny-app-android
          path: app/build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: vcpkg install openssl:x64-windows
      - name: Build server
        run: |
          cmake -S . -B build-windows -DCMAKE_BUILD_TYPE=Release -DBUNNY_BUILD_TESTS=OFF -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
          cmake --build build-windows --config Release -j
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Build app
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release
      # Server and app are separate downloads -- someone grabbing one
      # shouldn't be forced to also download the other.
      - name: Package app
        working-directory: app/build/windows/x64/runner/Release
        run: Compress-Archive -Path * -DestinationPath "${{ github.workspace }}/little-bunny-app-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: bunny-server-windows-x64
          path: build-windows/server/Release/bunny_server.exe
      - uses: actions/upload-artifact@v4
        with:
          name: little-bunny-app-windows-x64
          path: little-bunny-app-windows-x64.zip

  # Unsigned -- macOS Gatekeeper will warn on first launch until this is
  # signed with an Apple Developer certificate (not set up for this
  # project). Fine for personal/sideloaded use.
  build-app-macos-arm64:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - working-directory: app
        run: |
          flutter pub get
          flutter build macos --release
      - working-directory: app/build/macos/Build/Products/Release
        run: zip -r "${{ github.workspace }}/little-bunny-app-macos-arm64.zip" little_bunny.app
      - uses: actions/upload-artifact@v4
        with:
          name: little-bunny-app-macos-arm64
          path: little-bunny-app-macos-arm64.zip

  release:
    needs:
      [
        build-server-linux,
        build-app-linux,
        build-app-android,
        build-windows,
        build-app-macos-arm64,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }} (${{ github.sha }})"
          generate_release_notes: true
          files: artifacts/*

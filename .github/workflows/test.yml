name: Test

# Reusable (workflow_call) so release.yml can gate its build jobs on the
# exact same test run instead of duplicating these steps -- see that
# workflow's own `test` job.
on:
  pull_request:
  workflow_call:

env:
  FLUTTER_VERSION: "3.44.0" # keep in sync with app/.fvmrc

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install C toolchain + format checker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential cmake libssl-dev clang-format

      # make test-c, not make test -- the latter also runs bunny_core_ffi's/
      # app's Flutter tests (for local dev convenience), but Flutter/fvm
      # isn't installed on this runner until the subosito/flutter-action
      # step below, and this job already covers that layer itself via its
      # own pub get/analyze/build/test steps further down, with the exact
      # LD_LIBRARY_PATH setup those need -- running it again here would
      # both fail (fvm: not found) and duplicate work even if reordered.
      - name: C build + test + format-check
        run: |
          make build
          make test-c
          make format-check

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Flutter Linux desktop build deps
        run: |
          sudo apt-get install -y --no-install-recommends ninja-build libgtk-3-dev pkg-config libsecret-1-dev

      - name: bunny_core_ffi -- pub get + analyze
        working-directory: bunny_core_ffi
        run: |
          flutter pub get
          flutter analyze

      - name: app -- pub get + analyze
        working-directory: app
        run: |
          flutter pub get
          flutter analyze

      # Builds the native libbunny_core_ffi.so -- both bunny_core_ffi's and
      # app's own FFI-backed tests dlopen this at runtime (Dart FFI's
      # DynamicLibrary.open searches LD_LIBRARY_PATH), so it has to exist
      # and be fresh before either `flutter test` call below.
      - name: Build native FFI library
        working-directory: app
        run: flutter build linux --debug

      - name: bunny_core_ffi -- test
        working-directory: bunny_core_ffi
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/app/build/linux/x64/debug/bundle/lib
        run: flutter test

      - name: app -- test
        working-directory: app
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/app/build/linux/x64/debug/bundle/lib
        run: flutter test
